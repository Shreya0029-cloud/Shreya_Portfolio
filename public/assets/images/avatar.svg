<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="avatarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#4FACFE" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0A0E17" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111B27"/>
      <stop offset="100%" stop-color="#090E14"/>
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#avatarGlow)" />

  <!-- Outer Orbit Rings -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="#22364A" stroke-width="2" stroke-dasharray="6 8" />
  <circle cx="200" cy="200" r="145" fill="none" stroke="url(#cyberBorder)" stroke-width="2.5" opacity="0.8" />
  
  <!-- Rotating Node Accents -->
  <circle cx="345" cy="200" r="5" fill="#00F2FE" filter="url(#glowFilter)" />
  <circle cx="55" cy="200" r="5" fill="#10B981" filter="url(#glowFilter)" />
  <circle cx="200" cy="55" r="5" fill="#6366F1" filter="url(#glowFilter)" />
  <circle cx="200" cy="345" r="5" fill="#F59E0B" filter="url(#glowFilter)" />

  <!-- Core Hexagon Container -->
  <polygon points="200,80 290,132 290,268 200,320 110,268 110,132" fill="url(#coreGrad)" stroke="url(#cyberBorder)" stroke-width="3" filter="url(#glowFilter)"/>

  <!-- Code/Tech Matrix Grid -->
  <path d="M140 160 L170 160 M230 160 L260 160 M140 240 L170 240 M230 240 L260 240" stroke="#334B63" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Stylized Monogram SK -->
  <text x="200" y="215" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" text-anchor="middle" letter-spacing="4" filter="url(#glowFilter)">SK</text>
  
  <!-- Sub-Badge -->
  <rect x="135" y="240" width="130" height="24" rx="12" fill="#00F2FE" fill-opacity="0.15" stroke="#00F2FE" stroke-width="1.2" />
  <text x="200" y="256" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#00F2FE" text-anchor="middle" letter-spacing="2">VIT VELLORE</text>

  <!-- Status Ping -->
  <circle cx="200" cy="300" r="4" fill="#10B981" />
  <circle cx="200" cy="300" r="9" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.6">
    <animate attributeName="r" values="4;14;4" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>