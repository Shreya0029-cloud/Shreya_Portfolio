  <circle cx="270" cy="245" r="7" fill="#FBBF24" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="235" y="200" width="85" height="22" rx="4" fill="#0D1520" stroke="#FBBF24" stroke-width="1"/>
  <text x="277" y="215" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FBBF24" text-anchor="middle">En Route • 6m</text>

  <!-- Right Stacked Widgets -->
  <!-- Widget 1: Vendor Dashboard Stats -->
  <rect x="500" y="96" width="260" height="150" rx="12" fill="url(#fnCard)" stroke="#223347" stroke-width="1.5"/>
  <text x="520" y="124" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Vendor Analytics</text>
  <text x="520" y="162" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700" fill="#34D399">₹142,850</text>
  <text x="520" y="182" font-family="'Inter', sans-serif" font-size="11" fill="#8899A6">Razorpay Server-Side Verified</text>
  <rect x="520" y="200" width="220" height="6" rx="3" fill="#203042"/>
  <rect x="520" y="200" width="175" height="6" rx="3" fill="#34D399"/>

  <!-- Widget 2: AI Support Assistant -->
  <rect x="500" y="260" width="260" height="150" rx="12" fill="url(#fnCard)" stroke="#223347" stroke-width="1.5"/>
  <text x="520" y="288" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">AI Assistant &amp; RBAC</text>
  <rect x="520" y="304" width="220" height="34" rx="8" fill="#141F2D"/>
  <text x="532" y="325" font-family="'Inter', sans-serif" font-size="11" fill="#99B3CC">"Order #4829 out for delivery"</text>
  <rect x="520" y="348" width="105" height="24" rx="6" fill="#6366F1" fill-opacity="0.2"/>
  <text x="572" y="364" font-family="'JetBrains Mono', monospace" font-size="10" fill="#818CF8" text-anchor="middle">JWT AUTH</text>
  <rect x="635" y="348" width="105" height="24" rx="6" fill="#EC4899" fill-opacity="0.2"/>
  <text x="687" y="364" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F472B6" text-anchor="middle">OTP VERIFIED</text>
