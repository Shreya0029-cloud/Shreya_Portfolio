  <path d="M 70 300 C 140 300, 180 210, 240 210 S 300 160, 360 160 S 420 250, 450 250 L 450 350 L 70 350 Z" fill="url(#cmBlue)" fill-opacity="0.1"/>

  <circle cx="240" cy="210" r="5" fill="#38BDF8"/>
