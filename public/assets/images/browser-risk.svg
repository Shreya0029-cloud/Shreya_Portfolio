<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="brBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E28"/>
      <stop offset="100%" stop-color="#080E14"/>
    </linearGradient>
    <linearGradient id="brAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#brBg)" />

  <!-- Top bar -->
  <rect x="40" y="28" width="720" height="48" rx="10" fill="#1C2936" stroke="#2B4054" stroke-width="1.5"/>
  <text x="65" y="58" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="17" fill="#FFFFFF">BROWSER EXTENSION RISK AUDITOR</text>
  <rect x="360" y="40" width="130" height="24" rx="6" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-width="1"/>
  <text x="425" y="56" font-family="'JetBrains Mono', monospace" font-size="10" fill="#60A5FA" text-anchor="middle">CHROME MANIFEST V3</text>
  
  <rect x="500" y="40" width="120" height="24" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
  <text x="560" y="56" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34D399" text-anchor="middle">LIVE ON RENDER</text>

  <!-- Left: Security Audit Matrix -->
  <rect x="40" y="94" width="440" height="320" rx="12" fill="#182533" stroke="#2A4054" stroke-width="1.5"/>
  <text x="65" y="128" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Permission &amp; Privacy Audit Engine</text>
  <text x="65" y="148" font-family="'Inter', sans-serif" font-size="12" fill="#8AA8C4">Evaluates sensitive API calls • CSP validation • Risk Scoring</text>

  <rect x="65" y="172" width="390" height="44" rx="6" fill="#101A24" stroke="#EF4444" stroke-width="1"/>
  <text x="80" y="196" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F87171">High Risk: &lt;all_urls&gt; + webRequestBlocking</text>
  <text x="80" y="210" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8">Can inspect, modify, and exfiltrate unencrypted traffic</text>

  <rect x="65" y="226" width="390" height="44" rx="6" fill="#101A24" stroke="#F59E0B" stroke-width="1"/>
  <text x="80" y="250" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FBBF24">Medium Risk: cookies + storage + tabs</text>
  <text x="80" y="264" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8">Session cookie access across authenticated domains</text>

  <rect x="65" y="280" width="390" height="44" rx="6" fill="#101A24" stroke="#10B981" stroke-width="1"/>
  <text x="80" y="304" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34D399">Low Risk: contextMenus + notifications</text>
  <text x="80" y="318" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8">UI helper interactions within safe sandbox</text>

  <!-- Right: Risk Score Gauge -->
  <rect x="500" y="94" width="260" height="150" rx="12" fill="#182533" stroke="#2A4054" stroke-width="1.5"/>
  <text x="520" y="122" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Aggregate Extension Risk</text>
  <text x="520" y="160" font-family="'Space Grotesk', sans-serif" font-size="34" font-weight="800" fill="#EF4444">CRITICAL</text>
  <text x="520" y="180" font-family="'Inter', sans-serif" font-size="11" fill="#8AA8C4">Risk Index: 84 / 100</text>
  <text x="520" y="200" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FBBF24">Action: Revoke Host Permissions</text>

  <!-- Right Lower: Full Stack Tech Specs -->
