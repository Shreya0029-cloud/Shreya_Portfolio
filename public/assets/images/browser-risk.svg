  <text x="520" y="288" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Full Stack Tech Stack</text>
  <text x="520" y="314" font-family="'JetBrains Mono', monospace" font-size="10" fill="#61DAFB">• React Frontend (SPA)</text>
  <text x="520" y="334" font-family="'JetBrains Mono', monospace" font-size="10" fill="#68A063">• Node.js + Express API</text>
  <text x="520" y="354" font-family="'JetBrains Mono', monospace" font-size="10" fill="#336791">• PostgreSQL Database</text>
  <text x="520" y="374" font-family="'JetBrains Mono', monospace" font-size="10" fill="#A78BFA">• Chrome Extension MV3</text>
